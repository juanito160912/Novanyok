name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear proyecto Flutter y copiar la app
        run: |
          flutter create --org com.novanyok --project-name novanyok_app app
          cp lib/main.dart app/lib/main.dart
          rm -f app/test/widget_test.dart

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub add flutter_blue_plus:^1.32.0 permission_handler

      - name: Agregar permisos de Bluetooth
        working-directory: app
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          permisos = '''<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>
              '''
          assert '<application' in s
          s = s.replace('<application', permisos + '<application', 1)
          s = s.replace('android:label="novanyok_app"', 'android:label="Novanyok"')
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-novanyok
          path: app/build/app/outputs/flutter-apk/app-release.apk